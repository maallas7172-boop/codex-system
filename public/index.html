<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1f6feb" />
<title>إدارة الحسابات</title>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  (function () {
    const token = localStorage.getItem('session_token');
    const cached = typeof getCachedMe === 'function' ? getCachedMe() : null;
    
    // إذا لم يكن هناك جلسة نشطة وتوكن، اذهب فوراً لشاشة تسجيل الدخول
    if (!token || !cached || !cached.user) {
      location.replace('login.html');
      return;
    }
    
    // توجد جلسة نشطة بالفعل
    const u = cached.user;
    const hasAdmin = u.role === 'Admin' || u.canDash || u.canReports || u.canUsers || u.canSettings;
    location.replace(hasAdmin ? 'admin.html' : 'entry.html');
  })();
</script>
</head>
<body></body>
</html>
