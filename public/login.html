<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1f6feb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<title>تسجيل الدخول — إدارة الحسابات</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .login-msg{min-height:20px;margin-top:14px;font-size:13.5px;font-weight:700;text-align:center}
  .login-msg.err{color:var(--danger)}
  .login-msg.ok{color:var(--success)}
</style>
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:14px">
      <img src="Image/codex_logo.jpg" alt="شركة كودكس للبرمجيات" style="width:80px;height:80px;object-fit:cover;border-radius:20px;box-shadow:0 10px 24px rgba(37,99,235,0.25);border:2px solid #ffffff" />
    </div>
    <h1>إدارة الحسابات</h1>
    <p class="sub">منظومة إدارة الحسابات والتقارير المالية والميدانية</p>
    <form id="loginForm" class="form-grid">
      <div class="field full">
        <span>اسم المستخدم</span>
        <input type="text" id="userName" required autocomplete="username" placeholder="أدخل اسم المستخدم..." />
      </div>
      <div class="field full">
        <span>كلمة المرور</span>
        <div style="display:flex;gap:6px;position:relative">
          <input type="password" id="password" required autocomplete="current-password" placeholder="أدخل كلمة المرور..." style="flex:1" />
          <button type="button" class="btn btn-outline" id="toggleLoginPasswordBtn" style="padding:0 12px;font-size:16px" title="إظهار / إخفاء كلمة المرور">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary full" id="loginBtn" style="margin-top:6px;font-size:15px;padding:12px">تسجيل الدخول</button>
    </form>
    <div id="loginMessage" class="login-msg"></div>

    <div class="login-company-footer">
      <div>💻 تطوير وبرمجة: <strong>شركة كودكس للبرمجيات</strong></div>
      <div style="margin-top:4px">
        <span>خدمة العملاء والدعم الفني: </span>
        <a href="tel:783745550" class="dev-phone">📞 783745550</a>
      </div>
      <div style="font-size:11px;color:#94a3b8;margin-top:4px">جميع الحقوق محفوظة © 2026</div>
    </div>
  </div>
</main>
<script src="js/config.js?v=20260901-9"></script>
<script src="js/app.js?v=20260901-9"></script>
<script src="js/login.js?v=20260901-9"></script>
</body>
</html>
